name: Update gold & silver rates

# The Zakat calculator reads public/rates.json. Without this the nisab
# threshold silently drifts out of date, which is worse than showing nothing.
on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC = 08:00 IST, after GoodReturns posts the day's rate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch latest rates from GoodReturns
        run: node scripts/update-rates.mjs

      # The script leaves the file untouched if the scrape fails, so "no diff"
      # is the normal outcome on a bad day rather than something to report.
      - name: Commit rates.json if it changed
        run: |
          if git diff --quiet -- public/rates.json; then
            echo "No rate change today — nothing to commit."
          else
            git config user.name "rates-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/rates.json
            git commit -m "chore: update gold/silver rates from GoodReturns"
            git push
          fi
